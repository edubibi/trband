<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Libreto & Guión - Ópera Rock 90'</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090c12;
      --bg-card: rgba(16, 21, 33, 0.9);
      --bg-card-hover: rgba(22, 29, 46, 0.98);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #38bdf8;

      --accent-crew: #06b6d4;
      /* Dissonance Crew */
      --accent-tech: #10b981;
      /* Wall Street */
      --accent-love: #ec4899;
      /* Laura & Megan */
      --accent-hugo: #f59e0b;
      /* Hugo */

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --font-ui: 'Outfit', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image:
        radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.06) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.06) 0px, transparent 50%);
      color: var(--text-main);
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER SUPERIOR CON TOTALES */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9, 12, 18, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0.85rem 1.75rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .brand-badge {
      background: linear-gradient(135deg, #0284c7, #ec4899);
      color: #fff;
      font-weight: 800;
      font-size: 0.72rem;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
    }

    .timeline-summary {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      background: rgba(255, 255, 255, 0.03);
      padding: 0.35rem 1.2rem;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }

    .stat-pill {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .stat-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .stat-val {
      font-family: var(--font-mono);
      font-size: 1.05rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn {
      font-family: var(--font-ui);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #06b6d4);
      color: #fff;
      border: none;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #0369a1, #0891b2);
    }

    /* CONTENEDOR PRINCIPAL */
    .layout-container {
      display: grid;
      grid-template-columns: 290px 1fr;
      flex: 1;
      height: calc(100vh - 65px);
      overflow: hidden;
    }

    /* BARRA LATERAL (ÍNDICE DE ESCENAS) */
    .sidebar {
      background: rgba(12, 16, 25, 0.95);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .sidebar-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .scene-tree {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      padding: 0.75rem;
      flex: 1;
      overflow-y: auto;
    }

    .tree-item {
      padding: 0.65rem 0.85rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s ease;
    }

    .tree-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .tree-item-info {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      overflow: hidden;
    }

    .tree-item-title {
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 175px;
    }

    .tree-item-meta {
      font-size: 0.68rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    .badge-bando {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .badge-crew {
      color: var(--accent-crew);
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .badge-tech {
      color: var(--accent-tech);
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-love {
      color: var(--accent-love);
      background: rgba(236, 72, 153, 0.15);
      border: 1px solid rgba(236, 72, 153, 0.3);
    }

    .badge-clash {
      color: #f87171;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    /* WORKSPACE CENTRAL */
    .main-workspace {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 1.5rem 2.25rem;
      gap: 1.5rem;
    }

    .storyboard-container {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      max-width: 980px;
      margin: 0 auto;
      width: 100%;
    }

    /* TARJETA DE ESCENA TIPO LIBRETO */
    .scene-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      transition: all 0.2s ease;
    }

    .scene-card:hover {
      border-color: rgba(255, 255, 255, 0.15);
      background: var(--bg-card-hover);
    }

    /* CABECERA DE LA ESCENA */
    .scene-card-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 0.85rem;
    }

    .scene-title-group {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex: 1;
      min-width: 280px;
    }

    .scene-number {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.08);
      color: #38bdf8;
      padding: 0.3rem 0.55rem;
      border-radius: 5px;
    }

    .scene-title-input {
      font-family: var(--font-ui);
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
      background: transparent;
      border: none;
      border-bottom: 1px dashed transparent;
      outline: none;
      width: 100%;
      padding: 0.15rem 0;
    }

    .scene-title-input:focus {
      border-bottom-color: var(--border-focus);
    }

    .scene-meta-group {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .meta-tag-input {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border-subtle);
      border-radius: 5px;
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      padding: 0.25rem 0.5rem;
      outline: none;
    }

    /* SECCIÓN 1: HISTORIA Y ARGUMENTO */
    .section-box {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .label-story {
      color: #f59e0b;
    }

    .label-script {
      color: #38bdf8;
    }

    .label-music {
      color: #ec4899;
    }

    .textarea-story {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      color: var(--text-main);
      font-family: var(--font-ui);
      font-size: 0.88rem;
      line-height: 1.5;
      padding: 0.75rem 0.9rem;
      min-height: 70px;
      resize: vertical;
      outline: none;
    }

    .textarea-story:focus {
      border-color: #f59e0b;
      background: rgba(0, 0, 0, 0.4);
    }

    /* SECCIÓN 2: GUIÓN, DIÁLOGOS Y VOZ EN OFF */
    .textarea-script {
      width: 100%;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      color: #e2e8f0;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      line-height: 1.6;
      padding: 0.85rem 1rem;
      min-height: 140px;
      resize: vertical;
      outline: none;
    }

    .textarea-script:focus {
      border-color: #38bdf8;
      background: rgba(0, 0, 0, 0.5);
    }

    /* SECCIÓN 3: PROMPT DE ESTILO / SUNO */
    .music-bar {
      display: flex;
      gap: 0.65rem;
      align-items: center;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
    }

    .music-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #7dd3fc;
      font-family: var(--font-mono);
      font-size: 0.76rem;
      outline: none;
    }

    /* FOOTER DE LA TARJETA */
    .scene-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.65rem;
      border-top: 1px solid var(--border-subtle);
    }

    .footer-btn-group {
      display: flex;
      gap: 0.4rem;
    }

    /* MODAL DE EXPORTACIÓN */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-window {
      background: #101623;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      width: 100%;
      max-width: 820px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      padding: 1.15rem 1.5rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-body {
      padding: 1.25rem 1.5rem;
      overflow-y: auto;
      flex: 1;
    }

    .modal-body textarea {
      width: 100%;
      height: 420px;
      background: #090d16;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 1rem;
      color: #f1f5f9;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      line-height: 1.5;
      resize: vertical;
      outline: none;
    }

    .modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #0284c7;
      color: #fff;
      padding: 0.65rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 1000;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>

<body>

  <!-- HEADER FIJO: MINUTAJE Y ACCIONES GLOBALES -->
  <header>
    <div class="brand-group">
      <span class="brand-badge">Ópera Rock 90'</span>
      <h1 class="brand-title">DISSONANCE CREW <span
          style="font-weight:300; color:var(--text-muted); font-size:0.95rem;">| Libreto & Guión</span></h1>
    </div>

    <!-- MINUTAJE EN VIVO -->
    <div class="timeline-summary">
      <div class="stat-pill">
        <span class="stat-label">Tiempo Total</span>
        <span class="stat-val" id="totalTimeDisplay">00:00 / 90:00</span>
      </div>
      <div class="stat-pill">
        <span class="stat-label">Acto I</span>
        <span class="stat-val" id="act1TimeDisplay" style="color:#38bdf8;">00:00</span>
      </div>
      <div class="stat-pill">
        <span class="stat-label">Acto II</span>
        <span class="stat-val" id="act2TimeDisplay" style="color:#ec4899;">00:00</span>
      </div>
      <div class="stat-pill">
        <span class="stat-label">Acto III</span>
        <span class="stat-val" id="act3TimeDisplay" style="color:#f59e0b;">00:00</span>
      </div>
      <div class="stat-pill">
        <span class="stat-label">Escenas</span>
        <span class="stat-val" id="scenesCountDisplay" style="color:#fff;">0</span>
      </div>
    </div>

    <!-- ACCIONES -->
    <div class="header-actions">
      <button class="btn btn-primary" onclick="addNewScene()">+ Nueva Escena</button>
      <button class="btn" onclick="openExportModal()">📄 Exportar Guión</button>
      <button class="btn" onclick="exportJSON()">💾 Descargar JSON</button>
      <label class="btn" style="cursor:pointer;">
        📥 Cargar JSON
        <input type="file" id="fileInput" accept=".json" style="display:none;" onchange="importJSON(event)">
      </label>
      <button class="btn" onclick="saveToLocalStorage(true)">💾 Guardar</button>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL: ÍNDICE LATERAL + WORKSPACE -->
  <div class="layout-container">

    <!-- ÍNDICE DE ESCENAS -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Escaleta de Escenas</span>
        <span style="font-size:0.7rem; color:var(--text-dim);" id="sidebarCountTag">0 temas</span>
      </div>
      <div class="scene-tree" id="sceneTreeList">
        <!-- Generado dinámicamente -->
      </div>
    </aside>

    <!-- WORKSPACE: TARJETAS DE GUIÓN -->
    <main class="main-workspace">
      <div class="storyboard-container" id="storyboardContainer">
        <!-- Generado dinámicamente -->
      </div>
    </main>

  </div>

  <!-- MODAL PARA EXPORTAR TEXTO COMPLETO -->
  <div class="modal-overlay" id="exportModal">
    <div class="modal-window">
      <div class="modal-header">
        <h3 style="font-size:1.05rem; font-weight:700;">Guión Completo (Listo para leer o imprimir)</h3>
        <button class="btn" onclick="closeExportModal()">✕</button>
      </div>
      <div class="modal-body">
        <textarea id="exportTextArea" readonly></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="copyModalContent()">📋 Copiar Guión Completo</button>
        <button class="btn" onclick="closeExportModal()">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- TOAST DE NOTIFICACIÓN -->
  <div class="toast" id="toastNotification">Guardado</div>

  <script>
    // DATOS INICIALES CENTRADOS EN HISTORIA Y DIÁLOGO (SIN ACORDES)
    const DEFAULT_PROJECT = [
      {
        id: "scene-1",
        number: 1,
        act: 1,
        title: "Preludio - La Audición de Hugo (15 Años)",
        duration: "00:40",
        bando: "crew",
        story: "Hace 10 años. Sala de audición académica, fría y solemne. Hugo (15 años) acaba de terminar de cantar con el alma. El tribunal de tres tecnócratas con traje gris le deniega la entrada en seco sin mirarle a la cara. Hugo sale a la calle vacía bajo la lluvia, aprieta los puños y estalla en un himno operístico a lo Queen que define su vida.",
        script: "[Audition Room - Classical Piano Climax]\n...y vinieron a soñaaaaaaaar...\n[Dramatic Final Chord Hit]\n[Abrupt Stop]\n\n[Spoken - Distant Cold Voice]\nSiguiente. No nos llame.\n\n[Scene Change - Rain on the Street - Slow Melancholic Piano and Cello]\n\n[Verse 1 - Hugo - Intimate Reflection]\nEl frío en la acera no quema tanto\ncomo ver vuestros ojos de cristal.\nTantas reglas para medir el aire...\ntanto miedo a ver a alguien volar.\n\n[Chorus - Young Hugo - Pure Emotional Climax / Queen Style]\n¿Es que no me oís?\n¿De verdad que no me oís?\n¿O es que os asusta la marea\ncuando empieza a respirar?\n\n¿Es que no me oís?\n¡Vais a tener que oírme gritar!",
        stylePrompt: "theatrical rock opera, Queen style anthem, soaring passionate male vocal, dramatic grand piano, soaring Brian May style electric guitar, heavy punchy drums, operatic rock climax, emotional vibrato"
      },
      {
        id: "scene-2",
        number: 2,
        act: 1,
        title: "Nadie compra nuestra piel (Dissonance Crew)",
        duration: "04:24",
        bando: "crew",
        story: "Presente. Diez años después. Un viejo almacén portuario abandonado convertido en cuartel de arte y resistencia. Hugo lidera la banda con la armónica y la base funk a toda máquina mientras los bailarines entrenan. Laura entra en escena con un poder arrollador, desafiando a Hugo y tomando el micrófono con un derroche de soul callejero.",
        script: "[Intro - Slap Bass and Blues Harmonica Groove]\n\n[Verse 1 - Male Vocal - Hugo]\nBienvenidos a la grieta del sistema.\nAquí no se cotiza, aquí se sangra compás a compás.\n¿Es que no lo oís? El suelo está temblando ya.\n\n[Verse 2 - Female Vocal - Laura]\nDeja los discursos, Hugo, y dale gas.\nSi la ciudad duerme anestesiada,\nnosotras la vamos a quemar.\nMírame a los ojos si te atreves a bailar.\n\n[Pre-Chorus - Fast Vocal Trade]\n[Hugo] ¡El golpe en el dos!\n[Laura] ¡Y el fuego en la voz!\n[Hugo] ¡Que tiemble el cemento!\n[Laura] ¡Que empiece el movimiento!\n\n[Chorus - Duet / High Energy]\n¡Disonancia en vena, nadie compra nuestra piel!\n¡Si el mundo está sordo gritaremos más que ayer!\nRompe el cristal, siente el tambor,\naquí la calle tiene el control.\n\n[Instrumental Outro - Furious Blues Harmonica & Electric Guitar Solo]\n[End]",
        stylePrompt: "jazz-rock funk, 145 bpm, driving upbeat, double-time feel, snare on 2 and 4, punchy drums, slap bass, blues harmonica, Rhodes, theatrical rock opera, male and female vocals trading bars"
      },
      {
        id: "scene-3",
        number: 3,
        act: 1,
        title: "Tenemos la pasta (El Código de Los Frozen)",
        duration: "03:28",

    let project = [];

    // INICIALIZACIÓN
    function initApp() {
      const stored = localStorage.getItem('scavengers_project_clean_v8');
      if (stored) {
        try {
          project = JSON.parse(stored);
        } catch (e) {
          project = DEFAULT_PROJECT;
        }
      } else {
        project = DEFAULT_PROJECT;
      }
      renderAll();
    }

    // RENDERIZADO GLOBAL
    function renderAll() {
      updateTotals();
      renderSidebarTree();
      renderStoryboard();
    }

    // TIEMPOS
    function timeToSeconds(str) {
      if (!str) return 0;
      const parts = str.trim().split(':');
      if (parts.length === 2) {
        return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
      }
      return 0;
    }

    function secondsToTime(sec) {
      const mins = Math.floor(sec / 60);
      const s = sec % 60;
      return `${mins.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function updateTotals() {
      let total = 0;
      let a1 = 0, a2 = 0, a3 = 0;

      project.forEach(sc => {
        const s = timeToSeconds(sc.duration);
        total += s;
        if (sc.act === 1) a1 += s;
        else if (sc.act === 2) a2 += s;
        else if (sc.act === 3) a3 += s;
      });

      document.getElementById('totalTimeDisplay').innerText = `${secondsToTime(total)} / 90:00`;
      document.getElementById('act1TimeDisplay').innerText = secondsToTime(a1);
      document.getElementById('act2TimeDisplay').innerText = secondsToTime(a2);
      document.getElementById('act3TimeDisplay').innerText = secondsToTime(a3);
      document.getElementById('scenesCountDisplay').innerText = project.length;
      document.getElementById('sidebarCountTag').innerText = `${project.length} escenas`;
    }

    // SIDEBAR
    function renderSidebarTree() {
      const list = document.getElementById('sceneTreeList');
      list.innerHTML = '';

      project.forEach((sc, idx) => {
        const item = document.createElement('div');
        item.className = 'tree-item';
        item.onclick = () => scrollToScene(sc.id);

        let badgeClass = 'badge-crew';
        if (sc.bando === 'tech') badgeClass = 'badge-tech';
        if (sc.bando === 'love') badgeClass = 'badge-love';
        if (sc.bando === 'clash') badgeClass = 'badge-clash';

        item.innerHTML = `
          <div class="tree-item-info">
            <span class="tree-item-title">${sc.number}. ${sc.title}</span>
            <span class="tree-item-meta">Acto ${sc.act} • ${sc.duration || '00:00'}</span>
          </div>
          <span class="badge-bando ${badgeClass}">${sc.bando.toUpperCase()}</span>
        `;
        list.appendChild(item);
      });
    }

    function scrollToScene(id) {
      const el = document.getElementById(id);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.style.borderColor = '#38bdf8';
        setTimeout(() => el.style.borderColor = '', 1200);
      }
    }

    // RENDER PRINCIPAL DE TARJETAS
    function renderStoryboard() {
      const container = document.getElementById('storyboardContainer');
      container.innerHTML = '';

      project.forEach((sc, idx) => {
        const card = document.createElement('div');
        card.className = 'scene-card';
        card.id = sc.id;

        card.innerHTML = `
          <!-- CABECERA -->
          <div class="scene-card-header">
            <div class="scene-title-group">
              <span class="scene-number">#${sc.number}</span>
              <input class="scene-title-input" value="${escapeHtml(sc.title)}" onchange="updateField(${idx}, 'title', this.value)" placeholder="Título de la escena">
            </div>

            <div class="scene-meta-group">
              <select class="meta-tag-input" onchange="updateField(${idx}, 'act', parseInt(this.value, 10))">
                <option value="1" ${sc.act === 1 ? 'selected' : ''}>Acto I</option>
                <option value="2" ${sc.act === 2 ? 'selected' : ''}>Acto II</option>
                <option value="3" ${sc.act === 3 ? 'selected' : ''}>Acto III</option>
              </select>

              <select class="meta-tag-input" onchange="updateField(${idx}, 'bando', this.value)">
                <option value="crew" ${sc.bando === 'crew' ? 'selected' : ''}>Crew (Rebeldes)</option>
                <option value="tech" ${sc.bando === 'tech' ? 'selected' : ''}>Tech (Wall Street)</option>
                <option value="love" ${sc.bando === 'love' ? 'selected' : ''}>Megan / Intimidad</option>
                <option value="clash" ${sc.bando === 'clash' ? 'selected' : ''}>Cruce / Colisión</option>
              </select>

              <input class="meta-tag-input" style="width:75px; text-align:center;" value="${sc.duration}" onchange="updateDuration(${idx}, this.value)" placeholder="03:30">
            </div>
          </div>

          <!-- SECCIÓN 1: HISTORIA Y ARGUMENTO -->
          <div class="section-box">
            <label class="section-label label-story">📖 ¿Qué pasa aquí? (Historia y Acción Dramática)</label>
            <textarea class="textarea-story" onchange="updateField(${idx}, 'story', this.value)" placeholder="Explica la historia: qué ocurre, dónde están, qué conflicto hay...">${sc.story || ''}</textarea>
          </div>

          <!-- SECCIÓN 2: GUIÓN, DIÁLOGOS Y VOZ EN OFF -->
          <div class="section-box">
            <label class="section-label label-script">🎭 Guión, Diálogos y Voz en Off</label>
            <textarea class="textarea-script" onchange="updateField(${idx}, 'script', this.value)" placeholder="[VOZ EN OFF]...\n[HUGO]...\n[LAURA]...">${sc.script || ''}</textarea>
          </div>

          <!-- SECCIÓN 3: PROMPT DE ESTILO / SUNO -->
          <div class="section-box">
            <label class="section-label label-music">🎵 Estilo Musical & Prompt Suno</label>
            <div class="music-bar">
              <input class="music-input" value="${escapeHtml(sc.stylePrompt || '')}" onchange="updateField(${idx}, 'stylePrompt', this.value)" placeholder="Estilo musical, BPM, instrumentos...">
              <button class="btn" style="padding:0.25rem 0.6rem; font-size:0.7rem;" onclick="copyToClipboard('${escapeJs(sc.stylePrompt)}')">📋 Copiar Prompt</button>
            </div>
          </div>

          <!-- FOOTER -->
          <div class="scene-card-footer">
            <div class="footer-btn-group">
              <button class="btn" onclick="copySceneFull(${idx})">📋 Copiar Escena</button>
              <button class="btn" onclick="moveScene(${idx}, -1)">▲ Subir</button>
              <button class="btn" onclick="moveScene(${idx}, 1)">▼ Bajar</button>
            </div>
            <button class="btn" style="color:#f87171;" onclick="deleteScene(${idx})">🗑 Eliminar</button>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // OPERACIONES
    function updateField(idx, field, val) {
      project[idx][field] = val;
      saveToLocalStorage(false);
      renderSidebarTree();
    }

    function updateDuration(idx, val) {
      project[idx].duration = val;
      saveToLocalStorage(false);
      updateTotals();
      renderSidebarTree();
    }

    function addNewScene() {
      const num = project.length + 1;
      const newSc = {
        id: "scene-" + Date.now(),
        number: num,
        act: 1,
        title: `Nueva Escena #${num}`,
        duration: "03:30",
        bando: "crew",
        story: "Escribe aquí el argumento y lo que ocurre en esta escena...",
        script: "[VOZ EN OFF]\nTexto del narrador...\n\n[PERSONAJE]\nDiálogo o letra de la canción...",
        stylePrompt: "jazz-rock funk, 145 bpm, driving upbeat, double-time feel, snare on 2 and 4, punchy drums, slap bass, blues harmonica, Rhodes"
      };
      project.push(newSc);
      saveToLocalStorage(true);
      renderAll();
      scrollToScene(newSc.id);
    }

    function deleteScene(idx) {
      if (confirm(`¿Eliminar la escena "${project[idx].title}"?`)) {
        project.splice(idx, 1);
        project.forEach((sc, i) => sc.number = i + 1);
        saveToLocalStorage(true);
        renderAll();
      }
    }

    function moveScene(idx, dir) {
      const target = idx + dir;
      if (target < 0 || target >= project.length) return;
      const tmp = project[idx];
      project[idx] = project[target];
      project[target] = tmp;
      project.forEach((sc, i) => sc.number = i + 1);
      saveToLocalStorage(true);
      renderAll();
    }

    // COPIAS
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast("Copiado al portapapeles");
      });
    }

    function copySceneFull(idx) {
      const sc = project[idx];
      let txt = `=== ESCENA ${sc.number}: ${sc.title} (Acto ${sc.act} - ${sc.duration}) ===\n\n`;
      txt += `[HISTORIA / ARGUMENTO]\n${sc.story}\n\n`;
      txt += `[GUIÓN Y DIÁLOGOS]\n${sc.script}\n\n`;
      txt += `[PROMPT MUSICAL]\n${sc.stylePrompt}\n`;
      copyToClipboard(txt);
    }

    // EXPORTACIÓN A TEXTO COMPLETO
    function openExportModal() {
      let doc = `====================================================================\n`;
      doc += `   DISSONANCE CREW - LIBRETO Y GUIÓN COMPLETO (90 MINUTOS)\n`;
      doc += `   Duración total estimada: ${document.getElementById('totalTimeDisplay').innerText}\n`;
      doc += `====================================================================\n\n`;

      let currentAct = 0;
      project.forEach(sc => {
        if (sc.act !== currentAct) {
          currentAct = sc.act;
          doc += `\n####################################################################\n`;
          doc += `   ACTO ${currentAct}\n`;
          doc += `####################################################################\n\n`;
        }

        doc += `--------------------------------------------------------------------\n`;
        doc += `ESCENA ${sc.number}: ${sc.title.toUpperCase()}\n`;
        doc += `Duración: ${sc.duration} | Bando: ${sc.bando.toUpperCase()}\n`;
        doc += `Estilo: ${sc.stylePrompt}\n`;
        doc += `--------------------------------------------------------------------\n\n`;
        doc += `[HISTORIA Y ACCIÓN]\n${sc.story}\n\n`;
        doc += `[DIÁLOGOS Y LETRAS]\n${sc.script}\n\n\n`;
      });

      document.getElementById('exportTextArea').value = doc;
      document.getElementById('exportModal').classList.add('active');
    }

    function closeExportModal() {
      document.getElementById('exportModal').classList.remove('active');
    }

    function copyModalContent() {
      copyToClipboard(document.getElementById('exportTextArea').value);
    }

    // LOCAL STORAGE
    function saveToLocalStorage(notify = false) {
      localStorage.setItem('opera_rock_project_clean_v2', JSON.stringify(project));
      if (notify) showToast("Proyecto guardado");
    }

    // JSON IMPORT/EXPORT
    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(project, null, 2));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `dissonance_crew_guion_${Date.now()}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast("JSON descargado");
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = function (e) {
        try {
          const imp = JSON.parse(e.target.result);
          if (Array.isArray(imp)) {
            project = imp;
            saveToLocalStorage(true);
            renderAll();
            showToast("Proyecto cargado");
          }
        } catch (err) {
          alert("Error al cargar el archivo JSON");
        }
      };
      r.readAsText(file);
    }

    // UTILIDADES
    function escapeHtml(t) {
      if (!t) return '';
      return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function escapeJs(t) {
      if (!t) return '';
      return t.replace(/'/g, "\\'").replace(/\n/g, "\\n");
    }

    function showToast(msg) {
      const t = document.getElementById('toastNotification');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    window.onload = initApp;
  </script>
