<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOW MUSIC REEL - The Research Band</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080a0f;
            --card-bg: rgba(15, 19, 28, 0.9);
            --accent: #D4AF37;
            --accent-hover: #f5d665;
            --text-main: #f0f2f5;
            --text-muted: #9aa0a6;
            --border-color: rgba(212, 175, 55, 0.25);
            --border-highlight: rgba(212, 175, 55, 0.6);
            --input-bg: rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #161a26 0%, var(--bg-color) 75%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 1380px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            color: var(--accent);
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Panel de Control y Filtros */
        .controls-panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1.5;
            min-width: 250px;
        }

        .category-filter {
            flex: 1;
            min-width: 240px;
        }

        .form-control-top {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 11px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
        }

        .form-control-top:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            background: var(--accent);
            color: #000;
            font-weight: 700;
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }

        .btn-outline {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .btn-outline:hover {
            background: rgba(212, 175, 55, 0.15);
            color: #fff;
        }

        .stats-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 12px;
        }

        .stats-summary span {
            color: var(--accent);
        }

        /* Grid de Fichas */
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 25px;
        }

        .song-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 22px;
            backdrop-filter: blur(10px);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .song-card:hover {
            border-color: var(--border-highlight);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 10px;
        }

        .song-number {
            background: rgba(212, 175, 55, 0.15);
            color: var(--accent);
            font-weight: 800;
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #ff5555;
            cursor: pointer;
            font-size: 1.1rem;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .delete-btn:hover {
            opacity: 1;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.72rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .form-control {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 9px 12px;
            border-radius: 6px;
            font-size: 0.88rem;
            font-family: inherit;
            transition: border-color 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(0, 0, 0, 0.8);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 65px;
        }

        select.form-control {
            cursor: pointer;
        }

        /* Player Estilizado */
        .audio-player-wrapper {
            margin-top: 8px;
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            padding: 8px;
        }

        audio {
            width: 100%;
            height: 36px;
            border-radius: 6px;
            outline: none;
        }

        /* Modal de Vista Previa Ejecutiva */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .preview-card {
            background: #0d111a;
            border: 2px solid var(--accent);
            border-radius: 16px;
            max-width: 680px;
            width: 100%;
            padding: 35px;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.3);
            color: #fff;
            max-height: 90vh;
            overflow-y: auto;
        }

        .preview-header {
            border-bottom: 2px solid var(--accent);
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .preview-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--accent);
            margin: 0;
        }

        .preview-tag {
            background: rgba(212, 175, 55, 0.15);
            color: var(--accent);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            border: 1px solid var(--accent);
            display: inline-block;
            margin-top: 6px;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.03);
            padding: 18px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .preview-item label {
            font-size: 0.7rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 3px;
        }

        .preview-item span {
            font-size: 0.95rem;
            font-weight: 600;
            color: #f0f2f5;
        }

        .preview-notes {
            background: rgba(0, 0, 0, 0.5);
            border-left: 3px solid var(--accent);
            padding: 15px;
            border-radius: 6px;
            font-style: italic;
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #d1d5db;
        }

        .preview-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
        }

        /* Estilo para impresión / Dossier */
        @media print {
            body {
                background: #fff !important;
                color: #000 !important;
                padding: 0 !important;
            }
            .controls-panel, .delete-btn, .btn-group, header p, .audio-player-wrapper, .modal-overlay {
                display: none !important;
            }
            header h1 {
                color: #000 !important;
                font-size: 1.8rem !important;
            }
            .song-card {
                background: #fff !important;
                border: 1px solid #ccc !important;
                color: #000 !important;
                page-break-inside: avoid;
                box-shadow: none !important;
            }
            .form-control {
                background: #fff !important;
                color: #000 !important;
                border: 1px solid #ccc !important;
            }
            .form-group label, .song-number {
                color: #000 !important;
                border-color: #aaa !important;
                background: #eee !important;
            }
        }

        @media (max-width: 768px) {
            .grid-cards {
                grid-template-columns: 1fr;
            }
            .top-row {
                flex-direction: column;
                align-items: stretch;
            }
            .btn {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🎬 SHOW MUSIC REEL</h1>
            <p>Catálogo Oficial de Explotación Musical & Licenciamiento Sync para Cine, TV y Publicidad</p>
        </header>

        <!-- Datalist para sugerencias de Destino Comercial -->
        <datalist id="commercial-destinations">
            <option value="🎬 Cine de Acción / Persecución">
            <option value="🚀 Cine Sci-Fi / Ciencia Ficción">
            <option value="💖 Cine Romántico / Drama">
            <option value="🎭 Cine Musical / BSO">
            <option value="🕵️ Thriller / Suspenso / Noir">
            <option value="🎸 Música Callejera / Urban">
            <option value="📺 Spots Publicitarios / TV / Radio">
            <option value="🎮 Videojuegos / Gaming / Trailer">
            <option value="🎷 Smooth Jazz / Ambient / Lounge">
            <option value="⚡ Jazz Rock / Fusión">
            <option value="⭐ Selección Especial Productoras">
        </datalist>

        <!-- Panel de Control y Selección de Listas -->
        <div class="controls-panel">
            <div class="top-row">
                
                <!-- Buscador por texto libre -->
                <div class="search-box">
                    <input type="text" id="search-input" class="form-control-top" placeholder="🔍 Buscar por título, estilo, sub-género, tono, tempo o notas..." oninput="renderGrid()">
                </div>

                <!-- Selector Dinámico de Lista / Carpeta Personalizada -->
                <div class="category-filter">
                    <select id="list-filter" class="form-control-top" onchange="renderGrid()">
                        <option value="ALL">📁 TODAS LAS CANCIONES DEL SHOW REEL</option>
                    </select>
                </div>

            </div>

            <div class="top-row">
                <div class="btn-group">
                    <button class="btn" id="add-song-btn">➕ Añadir Canción al Reel</button>
                    <button class="btn btn-outline" id="export-json-btn">💾 Guardar Copia Reel (JSON)</button>
                    <button class="btn btn-outline" onclick="document.getElementById('file-input').click()">📂 Cargar Respaldos</button>
                    <button class="btn btn-outline" style="border-color: #ff5555; color: #ff5555;" onclick="resetCatalogClean()">🧹 Empezar de Cero Limpio</button>
                    <input type="file" id="file-input" style="display:none" accept=".json" onchange="importJSON(event)">
                </div>

                <div class="btn-group">
                    <button class="btn" style="background: #25D366; color: #fff;" onclick="exportDossierText()">📋 Copiar Show Reel para WhatsApp/Email</button>
                    <button class="btn btn-outline" onclick="printDossier()">🖨️ Exportar Show Reel en PDF</button>
                </div>
            </div>

            <div class="stats-summary">
                <div>Selección Reel actual: <span id="current-list-title" style="font-weight: 700; color: #fff;">Todas las canciones</span></div>
                <div>Obras en esta selección: <span id="filtered-count">0</span> de <span id="total-count">0</span> totales</div>
            </div>
        </div>

        <!-- Grid de Fichas -->
        <div id="songs-grid" class="grid-cards">
            <!-- Fichas de canciones editables -->
        </div>
    </div>

    <!-- Modal de Vista Previa de Ficha Ejecutiva -->
    <div id="preview-modal" class="modal-overlay" style="display: none;">
        <div class="preview-card" id="modal-content">
            <!-- Se puebla dinámicamente -->
        </div>
    </div>

    <script>
        let songsData = [];

        function initData() {
            const saved = localStorage.getItem('trband_show_music_reel_v4');
            if (saved) {
                try {
                    songsData = JSON.parse(saved);
                } catch (e) {
                    songsData = getSampleTemplate();
                }
            } else {
                songsData = getSampleTemplate();
            }

            updateCategoryFilterDropdown();
            renderGrid();
        }

        function getSampleTemplate() {
            return [
                {
                    id: 1786099845566,
                    title: "Duck, Frog and me",
                    category: "Banda Sonora / Gaming",
                    trackType: "🎷 Instrumental",
                    genre: "Funk-Rock / Jazz-Funk",
                    subgenre: "Banda Sonora / Videojuegos",
                    bpm: "120",
                    key: "Dm (Re menor)",
                    duration: "4/4 • 4:12",
                    sgaeCode: "",
                    licensing: "Disponible Licencia / Venta",
                    audioSrc: "assets/audio/muestras_20s/01_Duck_Frog_and_me_20s.mp3",
                    clientLink: "assets/audio/muestras_20s/01_Duck_Frog_and_me_20s.mp3",
                    notes: "\"Tema rítmico a 120 BPM con bajo virtuoso y atmósfera de videojuego/cine, libre de ataduras para Sync inmediato.\""
                },
                {
                    id: 1,
                    title: "Ball in play",
                    category: "⚡ Jazz Rock / Fusión",
                    trackType: "🎷 Instrumental",
                    genre: "Jazz/Fusion",
                    subgenre: "Jazz-Funk / Soul Jazz",
                    bpm: "150 BPM",
                    key: "D minor (Dm)",
                    duration: "4/4 • 3:36 (Muestra 20s)",
                    sgaeCode: "T3410913047",
                    licensing: "Sincronización TV/Cine/Sync",
                    audioSrc: "assets/audio/muestras_20s/Ball in play_20s.mp3",
                    clientLink: "",
                    notes: "Ritmo potente y marcado con gran groove. Excelente para bandas sonoras de acción, deportes o secuencias dinámicas."
                },
                {
                    id: 2,
                    title: "¿A dónde vas?",
                    category: "🎬 Cine de Acción / Persecución",
                    trackType: "🎷 Instrumental",
                    genre: "Jazz Fusion / Nu-Jazz",
                    subgenre: "Jazztronica / Electro-Funk Bass",
                    bpm: "135 BPM",
                    key: "La menor (Am)",
                    duration: "4/4 • 3:45 (Muestra 20s)",
                    sgaeCode: "SGAE-REG-02",
                    licensing: "Disponible Licencia / Venta",
                    audioSrc: "assets/audio/muestras_20s/a donde bass_20s.mp3",
                    clientLink: "",
                    notes: "Tema de Jazz Fusion moderno con bajo solista muy marcado y groove electrizante."
                }
            ];
        }

        function saveData() {
            localStorage.setItem('trband_show_music_reel_v4', JSON.stringify(songsData));
            updateStats();
        }

        function resetCatalogClean() {
            if (confirm("¿Quieres reiniciar el catálogo a un lienzo en blanco para ir añadiendo tus canciones una a una desde cero?")) {
                localStorage.removeItem('trband_show_music_reel_v3');
                localStorage.removeItem('trband_show_music_reel_v2');
                localStorage.removeItem('trband_show_music_reel');
                songsData = [];
                updateCategoryFilterDropdown();
                renderGrid();
            }
        }

        function updateStats() {
            document.getElementById('total-count').textContent = songsData.length;
        }

        function updateCategoryFilterDropdown() {
            const select = document.getElementById('list-filter');
            const currentSelected = select.value || 'ALL';

            const defaultCategories = [
                "🎬 Cine de Acción / Persecución",
                "🚀 Cine Sci-Fi / Ciencia Ficción",
                "💖 Cine Romántico / Drama",
                "🎭 Cine Musical / BSO",
                "🕵️ Thriller / Suspenso / Noir",
                "🎸 Música Callejera / Urban",
                "📺 Spots Publicitarios / TV / Radio",
                "🎮 Videojuegos / Gaming / Trailer",
                "🎷 Smooth Jazz / Ambient / Lounge",
                "⚡ Jazz Rock / Fusión",
                "⭐ Selección Especial Productoras"
            ];

            const customCategories = new Set(defaultCategories);
            songsData.forEach(s => {
                if (s.category && s.category.trim() !== '' && s.category !== 'Sin Clasificar') {
                    customCategories.add(s.category.trim());
                }
            });

            select.innerHTML = '<option value="ALL">📁 TODAS LAS CANCIONES DEL SHOW REEL</option>';
            Array.from(customCategories).sort().forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = `📁 Reel: ${cat}`;
                if (cat === currentSelected) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function renderGrid() {
            const grid = document.getElementById('songs-grid');
            grid.innerHTML = '';
            
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            const selectedCategory = document.getElementById('list-filter').value;
            
            const selectedTitleEl = document.getElementById('current-list-title');
            if (selectedCategory === 'ALL') {
                selectedTitleEl.textContent = "Todas las canciones del Show Reel";
            } else {
                selectedTitleEl.textContent = selectedCategory;
            }

            const filteredSongs = songsData.filter(s => {
                const matchesSearch = 
                    (s.title || '').toLowerCase().includes(searchVal) ||
                    (s.genre || '').toLowerCase().includes(searchVal) ||
                    (s.subgenre || '').toLowerCase().includes(searchVal) ||
                    (s.trackType || '').toLowerCase().includes(searchVal) ||
                    (s.key || '').toLowerCase().includes(searchVal) ||
                    (s.notes || '').toLowerCase().includes(searchVal) ||
                    (s.category || '').toLowerCase().includes(searchVal);
                
                const matchesCategory = (selectedCategory === 'ALL') || (s.category === selectedCategory);

                return matchesSearch && matchesCategory;
            });

            document.getElementById('filtered-count').textContent = filteredSongs.length;
            document.getElementById('total-count').textContent = songsData.length;

            if (filteredSongs.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px; background: rgba(0,0,0,0.3); border-radius: 8px;">No hay canciones registradas en este Reel o filtro.</div>`;
                return;
            }

            filteredSongs.forEach((song) => {
                const realIndex = songsData.findIndex(s => s.id === song.id);
                const card = document.createElement('div');
                card.className = 'song-card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="song-number">OBRA #${(realIndex + 1).toString().padStart(3, '0')}</span>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <button class="btn btn-outline" style="padding: 4px 10px; font-size: 0.75rem;" onclick="openPreviewModal(${realIndex})">👁️ Vista Previa Ficha</button>
                            <button class="delete-btn" title="Eliminar obra del Reel" onclick="deleteSong(${realIndex})">🗑️</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Título de la Obra</label>
                        <input type="text" class="form-control" value="${escapeHtml(song.title || '')}" onchange="updateField(${realIndex}, 'title', this.value)" placeholder="Título del tema">
                    </div>

                    <div class="form-group">
                        <label style="color: #4cd964;">📁 Lista / Destino Comercial (Categoría Reel)</label>
                        <input type="text" list="commercial-destinations" class="form-control" style="border-color: #4cd964; color: #4cd964; font-weight: 700;" value="${escapeHtml(song.category || '')}" onchange="updateField(${realIndex}, 'category', this.value)" placeholder="Ej: Cine Sci-Fi, Cine Romántico, Cine de Acción...">
                    </div>

                    <!-- Muestra MP3 & Casilla Instrumental / Cantada al lado -->
                    <div class="form-group">
                        <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                            <button class="btn btn-outline" style="padding: 8px 14px; font-size: 0.8rem; flex-shrink: 0;" onclick="document.getElementById('audio-file-${realIndex}').click()">📁 Seleccionar MP3 Local</button>
                            <input type="file" id="audio-file-${realIndex}" style="display:none" accept="audio/*" onchange="handleAudioUpload(${realIndex}, event)">
                            
                            <div style="flex: 1; min-width: 170px;">
                                <select class="form-control" style="border-color: #D4AF37; color: #D4AF37; font-weight: 700;" onchange="updateField(${realIndex}, 'trackType', this.value)">
                                    <option value="🎷 Instrumental" ${song.trackType === '🎷 Instrumental' ? 'selected' : ''}>🎷 Instrumental</option>
                                    <option value="🎤 Cantada (Vocal)" ${song.trackType === '🎤 Cantada (Vocal)' ? 'selected' : ''}>🎤 Cantada (Vocal)</option>
                                    <option value="🎶 Instrumental + Coros" ${song.trackType === '🎶 Instrumental + Coros' ? 'selected' : ''}>🎶 Instrumental + Coros</option>
                                    <option value="🎙️ Versión A Capella" ${song.trackType === '🎙️ Versión A Capella' ? 'selected' : ''}>🎙️ Versión A Capella</option>
                                </select>
                            </div>
                        </div>

                        <div class="audio-player-wrapper">
                            <audio id="audio-player-${realIndex}" controls src="${escapeHtml(song.audioSrc || song.clientLink || '')}">Tu navegador no soporta audio HTML5.</audio>
                            <div style="font-size: 0.7rem; color: #D4AF37; margin-top: 4px; text-align: right;">🔒 Muestra Protegida (Máx. 20s de adelanto)</div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Género Principal</label>
                            <input type="text" class="form-control" value="${escapeHtml(song.genre || '')}" onchange="updateField(${realIndex}, 'genre', this.value)" placeholder="Ej: Jazz/Fusion">
                        </div>
                        <div class="form-group">
                            <label style="color: var(--accent-hover);">Sub-género</label>
                            <input type="text" class="form-control" value="${escapeHtml(song.subgenre || '')}" onchange="updateField(${realIndex}, 'subgenre', this.value)" placeholder="Ej: Jazz-Funk/Soul-Jazz">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Tempo (BPM)</label>
                            <input type="text" class="form-control" value="${escapeHtml(song.bpm || '')}" onchange="updateField(${realIndex}, 'bpm', this.value)" placeholder="Ej: 150 BPM">
                        </div>
                        <div class="form-group">
                            <label>Tonalidad / Key</label>
                            <input type="text" class="form-control" value="${escapeHtml(song.key || '')}" onchange="updateField(${realIndex}, 'key', this.value)" placeholder="Ej: D minor (Dm)">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Compás / Duración</label>
                            <input type="text" class="form-control" value="${escapeHtml(song.duration || '')}" onchange="updateField(${realIndex}, 'duration', this.value)" placeholder="Ej: 4/4 • 3:36">
                        </div>
                        <div class="form-group">
                            <label>Registro SGAE / ISWC</label>
                            <input type="text" class="form-control" value="${escapeHtml(song.sgaeCode || '')}" onchange="updateField(${realIndex}, 'sgaeCode', this.value)" placeholder="Ej: T3410913047">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Estado Licencia / Venta</label>
                        <select class="form-control" onchange="updateField(${realIndex}, 'licensing', this.value)">
                            <option value="Sincronización TV/Cine/Sync" ${song.licensing === 'Sincronización TV/Cine/Sync' ? 'selected' : ''}>Sincronización TV/Cine/Sync</option>
                            <option value="Disponible Licencia / Venta" ${song.licensing === 'Disponible Licencia / Venta' ? 'selected' : ''}>Disponible Licencia / Venta</option>
                            <option value="Licencia Exclusiva Reservada" ${song.licensing === 'Licencia Exclusiva Reservada' ? 'selected' : ''}>Licencia Exclusiva Reservada</option>
                            <option value="En Catálogo General" ${song.licensing === 'En Catálogo General' ? 'selected' : ''}>En Catálogo General</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Observaciones / Ficha Técnica & Potencial Sync</label>
                        <textarea class="form-control" onchange="updateField(${realIndex}, 'notes', this.value)" placeholder="Detalles de solistas, adecuación para escenas de película...">${escapeHtml(song.notes || '')}</textarea>
                    </div>
                `;
                grid.appendChild(card);

                // Aplicar limitador de 20s de reproducción para proteger el tema completo
                setTimeout(() => {
                    const player = document.getElementById(`audio-player-${realIndex}`);
                    if (player) {
                        player.ontimeupdate = function() {
                            if (player.currentTime >= 20) {
                                player.pause();
                                player.currentTime = 0;
                            }
                        };
                    }
                }, 100);
            });

            saveData();
        }

        function syncAudioSrc(index, value) {
            songsData[index].audioSrc = value;
            songsData[index].clientLink = value;
            saveData();
            renderGrid();
        }

        function updateField(index, field, value) {
            songsData[index][field] = value;
            saveData();
            if (field === 'category') {
                updateCategoryFilterDropdown();
                renderGrid();
            }
        }

        function handleAudioUpload(index, event) {
            const file = event.target.files[0];
            if (!file) return;
            const objectUrl = URL.createObjectURL(file);
            songsData[index].audioSrc = objectUrl;
            if (!songsData[index].clientLink || songsData[index].clientLink.startsWith('http')) {
                songsData[index].clientLink = file.name;
            }
            saveData();
            renderGrid();
        }

        function openPreviewModal(index) {
            const s = songsData[index];
            const modal = document.getElementById('preview-modal');
            const content = document.getElementById('modal-content');

            content.innerHTML = `
                <div class="preview-header">
                    <div>
                        <span class="preview-tag">${escapeHtml(s.category || 'SIN CLASIFICAR')}</span>
                        <h2 class="preview-title" style="margin-top: 8px;">${escapeHtml(s.title || 'SIN TÍTULO').toUpperCase()}</h2>
                        <div style="color: var(--accent); font-size: 0.85rem; font-weight: 700; margin-top: 4px;">
                            ${escapeHtml(s.trackType || '🎷 Instrumental')} • ${escapeHtml(s.licensing || 'Sincronización TV/Cine/Sync')}
                        </div>
                    </div>
                    <button class="btn btn-outline" style="padding: 4px 10px; font-size: 0.9rem;" onclick="closePreviewModal()">❌</button>
                </div>

                <div class="preview-grid">
                    <div class="preview-item">
                        <label>Género Principal</label>
                        <span>${escapeHtml(s.genre || 'N/A')}</span>
                    </div>
                    <div class="preview-item">
                        <label>Sub-género</label>
                        <span>${escapeHtml(s.subgenre || 'N/A')}</span>
                    </div>
                    <div class="preview-item">
                        <label>Tempo (BPM)</label>
                        <span>${escapeHtml(s.bpm || 'N/A')}</span>
                    </div>
                    <div class="preview-item">
                        <label>Tonalidad / Key</label>
                        <span>${escapeHtml(s.key || 'N/A')}</span>
                    </div>
                    <div class="preview-item">
                        <label>Compás / Duración</label>
                        <span>${escapeHtml(s.duration || 'N/A')}</span>
                    </div>
                    <div class="preview-item">
                        <label>Registro SGAE / ISWC</label>
                        <span>${escapeHtml(s.sgaeCode || 'N/A')}</span>
                    </div>
                </div>

                ${s.notes ? `
                    <div class="preview-notes">
                        <strong style="color: var(--accent); font-style: normal; display: block; margin-bottom: 4px;">OBSERVACIONES TÉCNICAS & POTENCIAL SYNC:</strong>
                        "${escapeHtml(s.notes)}"
                    </div>
                ` : ''}

                <div style="background: rgba(212, 175, 55, 0.1); border: 1px solid var(--accent); border-radius: 8px; padding: 15px; margin-bottom: 20px;">
                    <label style="color: var(--accent); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; display: block; margin-bottom: 8px;">🎵 Muestra MP3:</label>
                    <audio id="modal-audio-player" controls src="${escapeHtml(s.audioSrc || s.clientLink || '')}" style="width: 100%;"></audio>
                    <div style="font-size: 0.7rem; color: #D4AF37; margin-top: 4px; text-align: right;">🔒 Muestra Protegida (Máx. 20s de adelanto)</div>
                </div>

                <div class="preview-actions">
                    <button class="btn" style="background: #25D366; color: #fff;" onclick="copySingleCardText(${index})">📋 Copiar esta Ficha para WhatsApp</button>
                    <button class="btn btn-outline" onclick="closePreviewModal()">Cerrar Vista Previa</button>
                </div>
            `;

            modal.style.display = 'flex';

            setTimeout(() => {
                const modalPlayer = document.getElementById('modal-audio-player');
                if (modalPlayer) {
                    modalPlayer.ontimeupdate = function() {
                        if (modalPlayer.currentTime >= 20) {
                            modalPlayer.pause();
                            modalPlayer.currentTime = 0;
                        }
                    };
                }
            }, 100);
        }

        function closePreviewModal() {
            document.getElementById('preview-modal').style.display = 'none';
        }

        function copySingleCardText(idx) {
            const s = songsData[idx];
            let text = `🎬 *FICHA COMERCIAL SHOW MUSIC REEL - THE RESEARCH BAND*\n\n`;
            text += `🎵 *${s.title.toUpperCase()}*\n`;
            text += `   • Formato: ${s.trackType || '🎷 Instrumental'}\n`;
            text += `   • Destino / Lista: ${s.category || 'N/A'}\n`;
            text += `   • Género / Sub-género: ${s.genre || 'N/A'}${s.subgenre ? ' (' + s.subgenre + ')' : ''}\n`;
            text += `   • Tempo: ${s.bpm || 'N/A'} | Tono: ${s.key || 'N/A'}\n`;
            text += `   • Compás/Duración: ${s.duration || 'N/A'}\n`;
            text += `   • Registro SGAE: ${s.sgaeCode || 'N/A'}\n`;
            text += `   • Estado: ${s.licensing || 'Sincronización TV/Cine/Sync'}\n`;
            
            // Si el audio es una ruta web publica (http), la incluye. Si es local o vacia, incluye el enlace limpio al Show Music Reel web
            if (s.clientLink && s.clientLink.startsWith('http')) {
                text += `   • 🎧 ESCUCHAR MUESTRA: ${s.clientLink}\n`;
            } else {
                text += `   • 🎬 EXPLORAR EN WEB: https://trbandmusic.es/show_music_reel.html\n`;
            }
            
            if (s.notes) text += `   • Observaciones: ${s.notes}\n`;
            text += `\n📩 Contacto & Licenciamiento: Eduardo Ramírez (The Research Band)\n🌐 Web: https://trbandmusic.es`;

            navigator.clipboard.writeText(text).then(() => {
                alert(`¡Ficha de "${s.title}" copiada impecablemente para WhatsApp!`);
            });
        }

        function deleteSong(index) {
            if (confirm(`¿Eliminar de tu Reel la obra "${songsData[index].title}"?`)) {
                songsData.splice(index, 1);
                updateCategoryFilterDropdown();
                renderGrid();
            }
        }

        document.getElementById('add-song-btn').addEventListener('click', () => {
            const currentCat = document.getElementById('list-filter').value;
            songsData.unshift({
                id: Date.now(),
                title: "Nueva Obra de Catálogo",
                category: currentCat !== 'ALL' ? currentCat : '🎬 Cine de Acción / Persecución',
                trackType: "🎷 Instrumental",
                genre: "",
                subgenre: "",
                bpm: "",
                key: "",
                duration: "4/4 • 3:30",
                sgaeCode: "",
                licensing: "Disponible Licencia / Venta",
                audioSrc: "",
                clientLink: "",
                notes: ""
            });
            updateCategoryFilterDropdown();
            renderGrid();
        });

        document.getElementById('export-json-btn').addEventListener('click', () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(songsData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `show_music_reel_trband_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        });

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        if (confirm(`Se van a cargar ${imported.length} canciones en tu Show Reel. ¿Confirmar?`)) {
                            songsData = imported;
                            updateCategoryFilterDropdown();
                            renderGrid();
                        }
                    }
                } catch (err) {
                    alert("Error al leer el archivo JSON.");
                }
            };
            reader.readAsText(file);
        }

        function exportDossierText() {
            const selectedCategory = document.getElementById('list-filter').value;
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            
            const filtered = songsData.filter(s => {
                const matchesSearch = (s.title || '').toLowerCase().includes(searchVal) || (s.genre || '').toLowerCase().includes(searchVal) || (s.subgenre || '').toLowerCase().includes(searchVal) || (s.trackType || '').toLowerCase().includes(searchVal);
                const matchesCategory = (selectedCategory === 'ALL') || (s.category === selectedCategory);
                return matchesSearch && matchesCategory;
            });

            if (filtered.length === 0) {
                alert("No hay canciones en la selección actual para exportar.");
                return;
            }

            let text = `🎬 *SHOW MUSIC REEL - THE RESEARCH BAND*\n`;
            text += `📁 *Selección:* ${selectedCategory === 'ALL' ? 'Catálogo General' : selectedCategory}\n`;
            text += `🗓️ *Fecha:* ${new Date().toLocaleDateString()}\n\n`;

            filtered.forEach((s, idx) => {
                text += `${idx + 1}. *${s.title.toUpperCase()}*\n`;
                text += `   • Formato: ${s.trackType || '🎷 Instrumental'}\n`;
                text += `   • Destino / Lista: ${s.category || 'N/A'}\n`;
                text += `   • Género / Sub-género: ${s.genre || 'N/A'}${s.subgenre ? ' (' + s.subgenre + ')' : ''}\n`;
                text += `   • Tempo: ${s.bpm || 'N/A'} | Tono: ${s.key || 'N/A'}\n`;
                text += `   • Compás/Duración: ${s.duration || 'N/A'}\n`;
                if (s.clientLink && s.clientLink.startsWith('http')) {
                    text += `   • 🎧 ESCUCHAR MUESTRA: ${s.clientLink}\n`;
                }
                if (s.notes) text += `   • Observaciones: ${s.notes}\n`;
                text += `\n`;
            });

            text += `📩 Contacto y Licenciamiento: Eduardo Ramírez (The Research Band)\n`;
            text += `🌐 Web Oficial: https://trbandmusic.es`;

            navigator.clipboard.writeText(text).then(() => {
                alert("¡Show Music Reel copiado al portapapeles! Listo para enviar a la productora/cliente por WhatsApp o Email.");
            }).catch(() => {
                alert("No se pudo copiar automáticamente.");
            });
        }

        function printDossier() {
            window.print();
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        window.onload = initData;
    </script>
</body>
</html>
