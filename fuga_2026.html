<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUGA (2026 Versions) - The Research Band</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050b14;
            --glass-bg: rgba(10, 20, 35, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f0f4f8;
            --text-muted: #8e9bb0;
            --accent: #d4af37; /* Dorado apagado inspirado en la portada */
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Fondo dinámico difuminado */
        .bg-blur {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background-image: url('assets/img/fuga/portada-fuga-2026-3000.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(60px) brightness(0.3);
            z-index: -1;
        }

        .player-container {
            width: 90%;
            max-width: 900px;
            display: flex;
            flex-direction: row;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        /* Columna Izquierda: Portada y Controles */
        .visual-section {
            width: 50%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 1px solid var(--glass-border);
        }

        .cover-art {
            width: 100%;
            max-width: 300px;
            aspect-ratio: 1/1;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            transition: transform 0.4s ease;
        }

        .cover-art:hover {
            transform: scale(1.02);
        }

        .now-playing {
            margin-top: 30px;
            text-align: center;
            width: 100%;
        }

        .track-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        button {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            color: var(--accent);
            transform: scale(1.1);
        }

        .play-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--text-main);
            color: var(--bg-color);
        }

        .play-btn:hover {
            background: var(--accent);
            color: var(--bg-color);
        }

        .progress-container {
            width: 100%;
            margin-top: 30px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            width: 0%;
            position: relative;
        }

        .progress::after {
            content: '';
            position: absolute;
            right: -6px;
            top: -4px;
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .progress-bar:hover .progress::after {
            opacity: 1;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* Columna Derecha: Playlist */
        .playlist-section {
            width: 50%;
            padding: 30px 0;
            display: flex;
            flex-direction: column;
            max-height: 600px;
        }

        .playlist-header {
            padding: 0 30px 20px;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 10px;
        }

        .playlist-header h2 {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--text-muted);
        }

        .track-list {
            list-style: none;
            overflow-y: auto;
            padding: 0 15px;
            /* Scrollbar styling */
            scrollbar-width: thin;
            scrollbar-color: var(--accent) transparent;
        }

        .track-list::-webkit-scrollbar {
            width: 6px;
        }
        .track-list::-webkit-scrollbar-thumb {
            background-color: var(--glass-border);
            border-radius: 10px;
        }

        .track-item {
            padding: 15px;
            margin: 5px 0;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }

        .track-item:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(5px);
        }

        .track-item.active {
            background: rgba(212, 175, 55, 0.1);
            border-left: 3px solid var(--accent);
        }

        .track-item.active .track-name {
            color: var(--accent);
            font-weight: 600;
        }

        .track-num {
            width: 30px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .track-info {
            flex-grow: 1;
        }

        .track-name {
            font-size: 1rem;
            margin-bottom: 3px;
        }

        .dedication {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.3);
            letter-spacing: 2px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .player-container {
                flex-direction: column;
                height: 90vh;
                max-height: none;
            }
            .visual-section {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--glass-border);
                padding: 20px;
            }
            .cover-art {
                max-width: 200px;
            }
            .playlist-section {
                width: 100%;
                flex-grow: 1;
                overflow: hidden;
            }
        }
    </style>
    <!-- Open Graph Meta Preview -->
    <meta property="og:title" content="The Research Band - Pop-Rock y Jazzrock">
    <meta property="og:description" content="Grupo musical The Research Band. Fusión de Jazz-Rock, Smooth Jazz y Pop-Rock avanzado.">
    <meta property="og:image" content="https://trbandmusic.es/assets/logo_trb_icon.png">
    <meta property="twitter:card" content="summary">
    <meta property="twitter:image" content="https://trbandmusic.es/assets/logo_trb_icon.png">

</head>
<body>
    <div class="bg-blur"></div>
    
    <!-- Botón Volver -->
    <a href="index.html" style="position: absolute; top: 25px; left: 25px; z-index: 100; background: rgba(10, 20, 35, 0.8); border: 1px solid var(--accent); color: var(--accent); text-decoration: none; padding: 10px 22px; border-radius: 30px; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0,0,0,0.5);">← Volver al Inicio</a>
    
    <div class="player-container">
        <!-- Columna Visual -->
        <div class="visual-section">
            <img src="assets/img/fuga/portada-fuga-2026-3000.jpg" alt="FUGA Cover Art" class="cover-art" id="cover">
            
            <div class="now-playing">
                <div class="track-title" id="title">Selecciona una pista</div>
                <div class="track-artist">The Research Band</div>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progress-container">
                    <div class="progress" id="progress"></div>
                </div>
                <div class="time-display">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button id="prev" title="Anterior">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button id="play" class="play-btn" title="Reproducir/Pausar">
                    <svg id="play-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pause-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button id="next" title="Siguiente">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>
        </div>

        <!-- Columna Playlist -->
        <div class="playlist-section">
            <div class="playlist-header">
                <h2>FUGA (2026 VERSIONS)</h2>
            </div>
            <ul class="track-list" id="track-list">
                <!-- Se inyecta con JS -->
            </ul>
        </div>
    </div>

    <div class="dedication">IN MEMORIAM OF PEPE AND LOLA</div>

    <audio id="audio"></audio>

    <script>
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('play');
        const prevBtn = document.getElementById('prev');
        const nextBtn = document.getElementById('next');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const titleEl = document.getElementById('title');
        const progress = document.getElementById('progress');
        const progressContainer = document.getElementById('progress-container');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const trackListEl = document.getElementById('track-list');

        // Nombres de archivos y títulos limpios
        const tracks = [
            { file: 'TANTO TRABAJAR.mp3', title: 'Tanto trabajar' },
            { file: '02cifras en la almohada.mp3', title: 'Cifras en la almohada' },
            { file: 'Dame tus manos.mp3', title: 'Dame tus manos' },
            { file: 'Te pienso.mp3', title: 'Te pienso' },
            { file: 'Y vienes tu.mp3', title: 'Y vienes tú' },
            { file: 'Siempre gritando.mp3', title: 'Siempre gritando' },
            { file: 'Y tal vez.mp3', title: 'Y tal vez' },
            { file: 'Dejalo estar.mp3', title: 'Déjalo estar' },
            { file: 'trozos de amor.mp3', title: 'Trozos de amor' },
            { file: 'Aun sin saber.mp3', title: 'Aún sin saber' }
        ];

        let trackIndex = 0;
        let isPlaying = false;
        const START_TIME = 60; // Iniciar en el minuto 1:00
        const PREVIEW_DURATION = 20; // 20 segundos de adelanto
        const END_TIME = START_TIME + PREVIEW_DURATION; // 1:20 (80s)

        function loadTrack(index) {
            audio.src = `assets/audio/fuga/${tracks[index].file}`;
            titleEl.textContent = tracks[index].title;
            updatePlaylistUI(index);
            audio.currentTime = START_TIME;
        }

        function buildPlaylist() {
            tracks.forEach((track, index) => {
                const li = document.createElement('li');
                li.classList.add('track-item');
                li.innerHTML = `
                    <div class="track-num">${(index + 1).toString().padStart(2, '0')}</div>
                    <div class="track-info">
                        <div class="track-name">${track.title}</div>
                        <div style="font-size: 0.75rem; color: var(--accent); margin-top: 2px;">Fragmento destacado (Minuto 1:00 • 20s)</div>
                    </div>
                `;
                li.addEventListener('click', () => {
                    trackIndex = index;
                    loadTrack(trackIndex);
                    playTrack();
                });
                trackListEl.appendChild(li);
            });
        }

        function updatePlaylistUI(activeIndex) {
            const items = document.querySelectorAll('.track-item');
            items.forEach((item, index) => {
                if (index === activeIndex) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        function playTrack() {
            isPlaying = true;
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'block';
            if (audio.currentTime < START_TIME || audio.currentTime >= END_TIME) {
                audio.currentTime = START_TIME;
            }
            audio.play();
        }

        function pauseTrack() {
            isPlaying = false;
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            audio.pause();
        }

        playBtn.addEventListener('click', () => {
            if (isPlaying) pauseTrack();
            else playTrack();
        });

        prevBtn.addEventListener('click', () => {
            trackIndex--;
            if (trackIndex < 0) trackIndex = tracks.length - 1;
            loadTrack(trackIndex);
            playTrack();
        });

        nextBtn.addEventListener('click', () => {
            trackIndex++;
            if (trackIndex > tracks.length - 1) trackIndex = 0;
            loadTrack(trackIndex);
            playTrack();
        });

        // Formatear tiempo (segundos a M:SS)
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec.toString().padStart(2, '0')}`;
        }

        audio.addEventListener('timeupdate', (e) => {
            const { currentTime } = e.srcElement;
            
            // Limitar a la franja de 20s desde 1:00
            if (currentTime >= END_TIME) {
                trackIndex++;
                if (trackIndex > tracks.length - 1) {
                    trackIndex = 0;
                    loadTrack(trackIndex);
                    pauseTrack(); // Al terminar todas las pistas del disco se detiene
                } else {
                    loadTrack(trackIndex);
                    playTrack();
                }
                return;
            }

            const elapsedInPreview = Math.max(0, currentTime - START_TIME);
            const progressPercent = Math.min(100, (elapsedInPreview / PREVIEW_DURATION) * 100);
            progress.style.width = `${progressPercent}%`;
            currentTimeEl.textContent = formatTime(currentTime);
        });

        audio.addEventListener('loadeddata', () => {
            durationEl.textContent = "1:20 (Adelanto 20s)";
        });

        // Click en la barra de progreso dentro del rango 1:00 - 1:20
        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const targetRatio = clickX / width;
            audio.currentTime = START_TIME + (targetRatio * PREVIEW_DURATION);
        });

        // Auto play siguiente pista
        audio.addEventListener('ended', () => {
            trackIndex++;
            if (trackIndex > tracks.length - 1) {
                trackIndex = 0;
                loadTrack(trackIndex);
                pauseTrack(); // Termina el disco entero y para
            } else {
                loadTrack(trackIndex);
                playTrack();
            }
        });

        // Inicializar
        buildPlaylist();
        loadTrack(trackIndex);
    </script>
</body>
</html>
