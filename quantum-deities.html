<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUANTUM DEITIES - The Research Band</title>
    <style>
        :root {
            --primary: #ffffff;
            --secondary: #a0a0a0;
            --accent: #00f2ff;
            --bg-glass: rgba(255, 255, 255, 0.1);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #1a1a2e;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            overflow-y: auto;
            overflow-x: hidden;
            flex-direction: column;
        }

        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* --- HEADER --- */
        .main-header { position: fixed; top: 0; left: 0; width: 100%; padding: 10px 30px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), transparent); z-index: 1000; }

        .logo-area { display: flex; align-items: center; gap: 15px; }

        .header-logo { height: 100px; filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.3)); transition: transform 0.3s ease; } .header-title-gold { font-size: 1.4rem; font-weight: 700; color: #FFFFFF; text-transform: none; letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5); }

        .header-title { display: none;  display: none; 
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .main-nav {
            display: flex;
            gap: 30px;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--accent);
        }

        /* --- CONTENT --- */
        .landing-content {
            position: relative;
            z-index: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 140px;
            padding-bottom: 60px;
        }

        .nft-hero {
            text-align: center;
            margin-bottom: 60px;
            width: 90%;
            max-width: 900px;
        }

        .section-title {
            font-size: 4rem;
            margin-bottom: 20px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            color: white;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-align: center;
        }

        .nft-desc {
            font-size: 1.4rem;
            color: white;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-mint {
            display: inline-block;
            background: var(--accent);
            color: black;
            padding: 15px 40px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-mint:hover {
            background: #fff;
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.6);
        }

        /* --- GALLERY LAYOUT --- */
        .gallery-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            width: 95%;
            max-width: 900px;
            margin-top: 20px;
        }

        .main-portada-box {
            text-align: center;
        }

        .main-portada-box img {
            width: 100%;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        /* --- FOOTER --- */
        .author-footer {
            margin-top: 60px;
            width: 100%;
            padding: 40px 20px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- MUSIC CONTROL --- */
        .music-control {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 50px;
            height: 140px; filter: drop-shadow(0 0 15px rgba(0, 242, 255, 0.4));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .music-control:hover {
            transform: scale(1.1);
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent);
        }

        .music-bars {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 15px;
        }

        .bar {
            width: 3px;
            background: var(--accent);
            height: 3px;
            border-radius: 1px;
        }

        .playing .bar {
            animation: dance 0.8s infinite ease-in-out;
        }

        @keyframes dance {

            0%,
            100% {
                height: 3px;
            }

            50% {
                height: 15px;
            }
        }

        .now-playing-label {
            position: absolute;
            right: 60px;
            background: rgba(0, 0, 0, 0.8);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            white-space: nowrap;
            opacity: 0;
            transform: translateX(10px);
            transition: all 0.3s ease;
            pointer-events: none;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .music-control:hover .now-playing-label {
            opacity: 1;
            transform: translateX(0);
        }
    </style>
</head>

<body>
    <div class="bg-layer">

            <source src="assets/video/background_compressed.mp4" type="video/mp4">

    </div>

    <header class="main-header">
        <div style="display: flex; flex-direction: column; align-items: start;">
            <div class="logo-area" onclick="window.location.href='index.html'" style="cursor: pointer;"><img src="assets/logo_trb_icon.png" alt="TRB Icon" class="header-logo"><span class="header-title-gold">The Research Band</span></div>
            <a href="index.html#coleccion-nft"
                style="color: #ff4b4b; font-weight: bold; font-size: 0.65rem; border: 1px solid #ff4b4b; padding: 2px 10px; border-radius: 4px; text-decoration: none; margin-top: 5px; letter-spacing: 1px; text-transform: uppercase;">&larr;
                SALIR</a>
        </div>
        <nav class="main-nav">
            <a href="index.html" class="nav-link">Inicio</a>
            <a href="nosotros.html" class="nav-link">Nosotros</a>
            <a href="iliada.html" class="nav-link">Mi Ilíada</a>
            <a href="galeria.html" class="nav-link">Galería</a>
            <a href="fursona-genesis.html" class="nav-link">Fursona Genesis</a>
            <a href="musica.html" class="nav-link">Música</a>
            <a href="contacto.html" class="nav-link">Contacto</a>
        </nav>
    </header>

    <main class="landing-content">
        <div class="nft-hero">
            <h1 class="section-title">QUANTUM DEITIES</h1>
            <p class="nft-desc">
                164 UNIQUE NFTs · FORGED AT THE NEXUS OF AI · CYBER MYTHOLOGY
            </p>
            <div style="margin-bottom: 40px;">
                <a href="https://quantum-deities-1premium.nfts2.me/" target="_blank" class="btn-mint">MINT EN
                    POLYGON</a>
            </div>

            <section class="gallery-container">
                <div class="main-portada-box">
                    <img src="static/images/quantum-deities-banner.png" alt="Quantum Deities Portada">
                </div>
            </section>
        </div>
    </main>

    <div class="author-footer">
        <div style="display: flex; align-items: center; font-weight: 700; margin-bottom: 20px;">
            <span style="margin-right: 8px;">produced by THEM</span>
            <img src="assets/them_logo.png" alt="THEM" style="height: 30px;">
        </div>
        <div style="font-weight: 700;">eduardo ramírez de cartagena &copy; 2026</div>
    </div>

    <!-- Music Control -->
    <div class="music-control" id="musicToggle" onclick="toggleMusic()">
        <span class="now-playing-label" id="trackName">Cargando música...</span>
        <div class="music-icon" id="musicStatusIcon">
            <div class="music-bars" id="bars">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </div>
    </div>

    <audio id="bgMusic" loop preload="auto"></audio>

    <script>
        const playlist = [
            "01Medianoche-en-la-Terraza.mp3",
            "All_around_if_you_want.mp3",
            "Black_and_grey_.mp3",
            "Close_Your_Feelings_Extended.mp3",
            "Groove_or_not.mp3",
            "Heaven_s_Glow.mp3",
            "Man_island_beach.mp3",
            "Meanwhile_I_Love_You.mp3",
            "Saxo_by_the_clouds.mp3",
            "Saxophone_Serenade.mp3",
            "Secret-of-Velvet.mp3",
            "Sharp-echoes.mp3",
            "Soft-corners.mp3",
            "Voices_for_dreams.mp3",
            "Woman_on_the_island_beach.mp3"
        ];

        const audio = document.getElementById('bgMusic');
        const toggleBtn = document.getElementById('musicToggle');
        const trackLabel = document.getElementById('trackName');

        function initMusic() {
            const randomIndex = Math.floor(Math.random() * playlist.length);
            const song = playlist[randomIndex];
            audio.src = song;
            const friendlyName = song.replace(/\.[^/.]+$/, "").replace(/_/g, " ").replace(/-/g, " ");
            trackLabel.innerText = "Sonnando: " + friendlyName;
            audio.play().then(() => {
                toggleBtn.classList.add('playing');
            }).catch(() => {
                trackLabel.innerText = "Click para música: " + friendlyName;
            });
        }

        function toggleMusic() {
            if (audio.paused) {
                audio.play();
                toggleBtn.classList.add('playing');
            } else {
                audio.pause();
                toggleBtn.classList.remove('playing');
            }
        }

        window.addEventListener('load', initMusic);
    </script>
</body>
