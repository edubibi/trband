<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Música - The Research Band</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ffffff;
            --secondary: #a0a0a0;
            --accent: #D4AF37;
            --bg-glass: rgba(255, 255, 255, 0.1);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background: #1a1a2e;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            overflow-x: hidden;
            flex-direction: column;
        }

        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* --- HEADER --- */
        .main-header { position: fixed; top: 0; left: 0; width: 100%; padding: 10px 30px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), transparent); z-index: 1000; }

        .logo-area { display: flex; align-items: center; gap: 15px; }

        .header-logo { height: 100px; filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3)); transition: transform 0.3s ease; } .header-title-gold { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 700; color: #FFFFFF; text-transform: none; letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5); }

        .header-title { display: none;  display: none; 
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .main-nav {
            display: flex;
            gap: 30px;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: all 0.3s;
            position: relative;
            padding: 10px 0;
        }

        /* Submenu Styling */
        .nav-item-dropdown {
            position: relative;
            display: inline-block;
        }

        .submenu {
            display: none;
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--accent);
            border-radius: 8px;
            min-width: 220px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 1001;
            padding: 10px 0;
            /* Removed margin-top to eliminate the gap */
        }

        .submenu::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 6px solid var(--accent);
        }

        .nav-item-dropdown:hover .submenu {
            display: block;
            animation: fadeInSubmenu 0.3s ease;
        }

        @keyframes fadeInSubmenu {
            from { opacity: 0; transform: translate(-50%, 10px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        .submenu-link {
            display: block;
            color: #ddd;
            padding: 12px 20px;
            text-decoration: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            text-align: center;
        }

        .submenu-link:hover {
            background: rgba(212, 175, 55, 0.1);
            color: var(--accent);
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--accent);
        }

        /* --- PLAYER CONTAINER --- */
        .player-container {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            width: 90%;
            max-width: 1000px;
            height: 80vh;
            display: flex;
            overflow: hidden;
            margin-top: 100px;
            z-index: 1;
        }

        /* Left Side */
        .now-playing {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .brand-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }

        .brand-logo {
            height: 140px; filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4));
            margin-right: 12px;
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .album-art {
            width: 240px;
            height: 240px;
            border-radius: 15px;
            background: #000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 25px;
            object-fit: cover;
        }

        .album-art.playing {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.02);
            }

            100% {
                transform: scale(1);
            }
        }

        .track-info h2 {
            margin: 0;
            font-size: 1.3rem;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
        }

        .track-info p {
            margin: 5px 0 20px;
            color: var(--secondary);
            font-size: 0.9rem;
        }

        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        audio {
            width: 100%;
            outline: none;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1.5rem;
            transition: color 0.2s;
        }

        .btn:hover {
            color: var(--accent);
        }

        .btn-main {
            font-size: 2.5rem;
        }

        /* Playlist Panel */
        .playlist-panel {
            display: flex;
            flex-direction: column;
            width: 40%;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
        }

        .playlist-header {
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tabs {
            display: flex;
            gap: 10px;
        }

        .tab {
            flex: 1;
            padding: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.05);
            color: var(--secondary);
            cursor: pointer;
            border-radius: 6px;
            font-weight: 600;
        }

        .tab.active {
            background: var(--accent);
            color: white;
        }

        #searchInput {
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            outline: none;
        }

        .track-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
        }

        .track-item {
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .track-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .track-item.active {
            background: rgba(255, 255, 255, 0.1);
            border-left: 4px solid var(--accent);
        }

        .track-name {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .add-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
        }

        /* --- FOOTER --- */
        .author-footer {
            margin-top: 60px;
            width: 100%;
            padding: 40px 20px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @media (max-width: 768px) {
            .player-container {
                flex-direction: column;
                height: 90vh;
                margin-top: 80px;
                border-radius: 0;
                width: 100%;
            }

            .playlist-panel {
                width: 100%;
                border-left: none;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
                flex: 1;
                min-height: 300px;
            }

            .now-playing {
                padding: 20px;
                flex: none;
            }

            .album-art {
                width: 180px;
                height: 180px;
            }

            .main-header { 
                padding: 10px 15px; 
                background: rgba(0, 0, 0, 0.95);
            }

            .main-nav {
                gap: 8px;
                padding-bottom: 15px;
            }

            .nav-link {
                font-size: 0.75rem;
                padding: 8px 10px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 4px;
            }
            
            .header-logo {
                height: 60px;
            }
        }
    </style>
</head>

<body>
    <div class="bg-layer">
        <img src="assets/saltos_en_las_rocas.png" alt="Fondo" style="width: 100%; height: 100%; object-fit: cover;">
    </div>

    <header class="main-header">
        <div class="logo-area" onclick="window.location.href='index.html'" style="cursor: pointer;"><img src="assets/logo_trb_icon.png" alt="TRB Icon" class="header-logo"><span class="header-title-gold">The Research Band</span></div>
        <nav class="main-nav">
            <a href="index.html" class="nav-link">Inicio</a>
            <a href="nosotros.html" class="nav-link">Nosotros</a>
            <a href="iliada.html" class="nav-link">Mi Ilíada</a>
            <a href="galeria.html" class="nav-link">Galería</a>
            
            <div class="nav-item-dropdown">
                <a href="musica.html" class="nav-link active">Música y Merchandising</a>
                <div class="submenu">
                    <a href="musica.html" class="submenu-link">Reproductor Musical</a>

                </div>
            </div>

            <a href="contacto.html" class="nav-link">Contacto</a>
        </nav>
    </header>

    <div class="player-container">
        <div class="now-playing">
            <div class="brand-header">
                <img src="assets/logo_trb_icon.png" class="brand-logo">
                <div class="brand-title">The Research Band</div>
            </div>
            <img src="assets/portada_jazz.png" class="album-art" id="coverDisplay"
                onerror="this.src='https://via.placeholder.com/300/000000/FFFFFF?text=Music'">
            <div class="track-info">
                <h2 id="trackTitle">Selecciona una canción</h2>
                <p id="trackArtist">The Research Band</p>
            </div>
            <div class="controls">
                <audio id="audioPlayer" controls></audio>
                <div class="buttons">
                    <button class="btn" onclick="prevTrack()">⏮</button>
                    <button class="btn btn-main" onclick="togglePlay()">⏯</button>
                    <button class="btn" onclick="nextTrack()">⏭</button>
                </div>
            </div>
        </div>

        <div class="playlist-panel">
            <div class="playlist-header">
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('all')" id="tabAll">📚 Biblioteca</button>
                    <button class="tab" onclick="switchTab('fav')" id="tabFav">⭐ Mi Playlist <span
                            id="favCount">(0)</span></button>
                </div>
                <input type="text" id="searchInput" placeholder="🔍 Buscar..." onkeyup="filterPlaylist()">
            </div>
            <ul class="track-list" id="playlist"></ul>
        </div>
    </div>

    <div class="author-footer">
        <div style="display: flex; align-items: center; font-weight: 700; margin-bottom: 20px;">
            <span style="margin-right: 8px;">produced by KHEM</span>
            <img src="assets/them_logo.png" alt="THEM" style="height: 30px;">
        </div>
        <div style="font-weight: 700;">eduardo ramírez de cartagena &copy; 2026</div>
    </div>

    <script>
        let fullPlaylist = ["01Medianoche-en-la-Terraza.mp3", "All_around_if_you_want.mp3", "Black_and_grey_.mp3", "Close_Your_Feelings_Extended.mp3", "Groove_or_not.mp3", "Heaven_s_Glow.mp3", "Man_island_beach.mp3", "Meanwhile_I_Love_You.mp3", "Saxo_by_the_clouds.mp3", "Saxophone_Serenade.mp3", "Secret-of-Velvet.mp3", "Sharp-echoes.mp3", "Soft-corners.mp3", "Voices_for_dreams.mp3", "Woman_on_the_island_beach.mp3"].map(f => ({
            name: f.replace(/\.[^/.]+$/, "").replace(/_/g, " "),
            url: f
        }));

        let myPlaylist = [];
        let currentMode = 'all';
        let currentIndex = 0;
        let activeQueue = fullPlaylist;

        const audioPlayer = document.getElementById('audioPlayer');
        const playlistEl = document.getElementById('playlist');
        const trackTitle = document.getElementById('trackTitle');
        const coverDisplay = document.getElementById('coverDisplay');
        const searchInput = document.getElementById('searchInput');
        const favCount = document.getElementById('favCount');

        function switchTab(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(mode === 'all' ? 'tabAll' : 'tabFav').classList.add('active');
            renderPlaylist();
        }

        function renderPlaylist() {
            const query = searchInput.value.toLowerCase();
            const source = currentMode === 'all' ? fullPlaylist : myPlaylist;
            playlistEl.innerHTML = "";
            activeQueue = source;

            source.forEach((track, idx) => {
                if (query && !track.name.toLowerCase().includes(query)) return;
                const li = document.createElement('li');
                li.className = 'track-item' + (currentIndex === idx && source === activeQueue ? ' active' : '');
                li.innerHTML = `<span class="track-name">${track.name}</span>
                                <button class="add-btn" onclick="event.stopPropagation(); ${currentMode === 'all' ? 'addToFav' : 'removeFromFav'}(${idx})">${currentMode === 'all' ? '+' : 'x'}</button>`;
                li.onclick = () => loadTrack(idx);
                playlistEl.appendChild(li);
            });
        }

        function addToFav(index) {
            const track = fullPlaylist[index];
            if (!myPlaylist.find(t => t.url === track.url)) {
                myPlaylist.push(track);
                favCount.innerText = `(${myPlaylist.length})`;
            }
        }

        function removeFromFav(index) {
            myPlaylist.splice(index, 1);
            favCount.innerText = `(${myPlaylist.length})`;
            if (currentMode === 'fav') renderPlaylist();
        }

        function loadTrack(index) {
            if (index < 0 || index >= activeQueue.length) return;
            currentIndex = index;
            const track = activeQueue[index];
            audioPlayer.src = track.url;
            audioPlayer.play();
            trackTitle.innerText = track.name;
            renderPlaylist();
        }

        function togglePlay() {
            if (audioPlayer.paused) audioPlayer.play();
            else audioPlayer.pause();
        }

        function nextTrack() { loadTrack((currentIndex + 1) % activeQueue.length); }
        function prevTrack() { loadTrack((currentIndex - 1 + activeQueue.length) % activeQueue.length); }
        function filterPlaylist() { renderPlaylist(); }

        audioPlayer.addEventListener('ended', nextTrack);
        audioPlayer.onplay = () => coverDisplay.classList.add('playing');
        audioPlayer.onpause = () => coverDisplay.classList.remove('playing');

        loadTrack(0);
        audioPlayer.pause(); // Don't autoplay on load
    </script>
</body>

</html>
